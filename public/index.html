<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Favicon Forge</title><link rel="stylesheet" href="/styles.css"><script defer src="/app.js"></script></head><body><main class="shell"><header><span class="eyebrow">BRAND ASSET WORKSHOP</span><h1>Favicon <b>Forge</b></h1><p>Turn a few initials and colors into a matching SVG and PNG favicon.</p></header>
<section class="layout"><section class="panel controls"><label>Initials or symbol<input id="label" value="CF" maxlength="4"></label><label>Background<input id="bg" type="color" value="#123b46"></label><label>Foreground<input id="fg" type="color" value="#e8fff9"></label><label>Shape<select id="shape"><option value="rounded">Rounded square</option><option value="circle">Circle</option><option value="square">Square</option></select></label><label>Text size<input id="size" type="range" min="24" max="72" value="54"><small id="size-value">54 px</small></label></section>
<section class="panel preview"><div class="preview-head"><h2>Preview</h2><span>64 × 64</span></div><div class="canvas"><img id="preview" alt="Generated favicon preview"></div><div class="buttons"><button id="svg">Download SVG</button><button id="png">Download PNG</button></div><p id="status" role="status">Your icon is generated locally in this browser.</p></section></section>
<section class="panel"><h2>HTML snippet</h2><pre id="snippet"></pre><button id="copy">Copy snippet</button></section><footer>No upload, account, or external image service required.</footer></main></body></html>
